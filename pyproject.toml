[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mywebtools"
version = "0.1.0"
description = "Personal, mobile-first media toolbox (PDF, OCR, speech-to-text, digital avatar PiP) for ARM Linux boards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "PyMuPDF>=1.24.3",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
heif = ["pillow-heif>=0.16"]
# dev: tests also cover the model services (services/) with stand-in models
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "numpy>=1.24", "python-multipart>=0.0.9", "uroman>=1.3"]

[project.scripts]
mywebtools = "mywebtools.__main__:main"

[tool.setuptools.packages.find]
include = ["mywebtools*"]

[tool.setuptools.package-data]
mywebtools = ["static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
