name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel, sdist and a deploy tarball
        run: |
          pip install build
          python -m build
          tar --exclude-vcs --exclude=dist --exclude=.github -czf "dist/mywebtools-${GITHUB_REF_NAME}.tar.gz" \
            mywebtools deploy requirements*.txt pyproject.toml README.md .env.example
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
